# Local stack: PostgreSQL, the API, and the Streamlit dashboard.
# The database password is the documented local placeholder, not a production secret.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_governance
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ai_governance
    ports:
      - "5432:5432"
    volumes:
      - ai_governance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_governance -d ai_governance"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    command: ["api"]
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://ai_governance:change-me@postgres:5432/ai_governance
      LLM_ENABLED: "false"
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  dashboard:
    build: .
    command: ["dashboard"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai_governance_postgres:
